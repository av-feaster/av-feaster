name: Update Medium Posts

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-medium-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Medium RSS feed
        run: |
          # Replace YOUR_MEDIUM_USERNAME with your actual Medium username
          curl -s https://medium.com/feed/@breakwithlimits > feed.xml

      - name: Parse RSS and update README
        run: |
          python3 << 'EOF'
          import xml.etree.ElementTree as ET
          import re
          from datetime import datetime
          import html

          # Parse RSS feed
          tree = ET.parse('feed.xml')
          root = tree.getroot()

          # Extract latest 3 posts
          posts = []
          for item in root.findall('.//item')[:3]:
              title = item.find('title').text
              link = item.find('link').text
              description = item.find('description').text if item.find('description') is not None else ""
              content_encoded = item.find('{http://purl.org/rss/1.0/modules/content/}encoded')
              pub_date = item.find('pubDate').text
              
              # Extract featured image from content
              featured_image = ""
              if content_encoded is not None:
                  content_text = content_encoded.text
                  # Try to extract first image from content
                  img_match = re.search(r'<img[^>]+src=["\']([^"\']+)["\']', content_text)
                  if img_match:
                      featured_image = img_match.group(1)
              
              # Clean description (strip HTML tags)
              clean_desc = re.sub('<[^<]+?>', '', description)
              clean_desc = html.unescape(clean_desc)
              clean_desc = clean_desc[:200] + '...' if len(clean_desc) > 200 else clean_desc
              
              # Format date
              try:
                  date_obj = datetime.strptime(pub_date, '%a, %d %b %Y %H:%M:%S %Z')
                  formatted_date = date_obj.strftime('%B %d, %Y')
              except:
                  formatted_date = pub_date
              
              # Create Medium-style card
              if featured_image:
                  card = f'''<a href="{link}">
            <table>
              <tr>
                <td width="70%">
                  <p>
                    <strong>{title}</strong>
                  </p>
                  <p>
                    <em>{clean_desc}</em>
                  </p>
                  <p>
                    <small>{formatted_date}</small>
                  </p>
                </td>
                <td width="30%">
                  <img src="{featured_image}" width="120" height="80" style="border-radius: 8px; object-fit: cover;"/>
                </td>
              </tr>
            </table>
          </a>'''
              else:
                  card = f'''<a href="{link}">
            <table>
              <tr>
                <td width="100%">
                  <p>
                    <strong>{title}</strong>
                  </p>
                  <p>
                    <em>{clean_desc}</em>
                  </p>
                  <p>
                    <small>{formatted_date}</small>
                  </p>
                </td>
              </tr>
            </table>
          </a>'''
              
              posts.append(card)

          # Update README
          with open('README.md', 'r') as f:
              content = f.read()

          # Find and replace Medium section
          if '<!-- MEDIUM_POSTS_START -->' in content:
              content = re.sub(
                  r'<!-- MEDIUM_POSTS_START -->.*?<!-- MEDIUM_POSTS_END -->',
                  '<!-- MEDIUM_POSTS_START -->\n          \n          '.join(posts) + '\n          <!-- MEDIUM_POSTS_END -->',
                  content,
                  flags=re.DOTALL
              )

          with open('README.md', 'w') as f:
              f.write(content)
          EOF

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --staged --quiet || git commit -m "Update Medium posts [skip ci]"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
