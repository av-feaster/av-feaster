name: Update Medium Posts

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-medium-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Medium RSS feed
        run: |
          # Replace YOUR_MEDIUM_USERNAME with your actual Medium username
          curl -s https://medium.com/feed/@breakwithlimits > feed.xml

      - name: Parse RSS and update README
        run: |
          python3 << 'EOF'
          import xml.etree.ElementTree as ET
          import re
          from datetime import datetime

          # Parse RSS feed
          tree = ET.parse('feed.xml')
          root = tree.getroot()

          # Extract latest 3 posts
          posts = []
          for item in root.findall('.//item')[:3]:
              title = item.find('title').text
              link = item.find('link').text
              description = item.find('description').text if item.find('description') is not None else ""
              pub_date = item.find('pubDate').text
              
              # Clean description (strip HTML tags)
              import re
              clean_desc = re.sub('<[^<]+?>', '', description)
              clean_desc = clean_desc[:150] + '...' if len(clean_desc) > 150 else clean_desc
              
              # Format date
              try:
                  date_obj = datetime.strptime(pub_date, '%a, %d %b %Y %H:%M:%S %Z')
                  formatted_date = date_obj.strftime('%B %d, %Y')
              except:
                  formatted_date = pub_date
              
              # Create card-style markdown
              card = f'''<a href="{link}">
            <div align="center">
              <table>
                <tr>
                  <td width="100%">
                    <p align="center">
                      <strong>{title}</strong>
                    </p>
                    <p align="center">
                      <em>{clean_desc}</em>
                    </p>
                    <p align="center">
                      <small>{formatted_date}</small>
                    </p>
                  </td>
                </tr>
              </table>
            </div>
          </a>'''
              
              posts.append(card)

          # Update README
          with open('README.md', 'r') as f:
              content = f.read()

          # Find and replace Medium section
          if '<!-- MEDIUM_POSTS_START -->' in content:
              content = re.sub(
                  r'<!-- MEDIUM_POSTS_START -->.*?<!-- MEDIUM_POSTS_END -->',
                  '<!-- MEDIUM_POSTS_START -->\n          \n          '.join(posts) + '\n          <!-- MEDIUM_POSTS_END -->',
                  content,
                  flags=re.DOTALL
              )

          with open('README.md', 'w') as f:
              f.write(content)
          EOF

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --staged --quiet || git commit -m "Update Medium posts [skip ci]"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
